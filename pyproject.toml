[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clavis"
version = "0.1.0"
description = "Acquisition board control daemon and CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi",
  "httpx>=0.27",
  "pydantic",
  "textual",
  "typer>=0.9",
  "uvicorn",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
clavis = "clavis.cli:app"
clavisd = "clavis.daemon:app"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
