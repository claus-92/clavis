services:
  daemon:
    container_name: clavis
    image: ${CLAVIS_DAEMON_IMAGE:-clavis:local}
    build:
      context: .
      dockerfile: Dockerfile
    command: ["clavisd", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      CLAVIS_HOST: http://127.0.0.1:8000
    ports:
      - "${CLAVIS_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/status')"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
