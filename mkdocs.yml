site_name: Clavis
site_description: Control Layer for Acquisition-board Validation and Interface Services
site_url: https://claus-92.github.io/clavis/
repo_url: https://github.com/claus-92/clavis
repo_name: claus-92/clavis
edit_uri: edit/main/docs/

theme:
  name: mkdocs
  logo: logo.jpg
  favicon: logo.jpg
  color_mode: auto
  user_color_mode_toggle: true
  navigation_depth: 3

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Configuration: configuration.md
  - Board plugins: plugins.md
  - Architecture: architecture.md
  - Deployment:
      - Docker: docker.md
      - Native service: native-service.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

copyright: Copyright 2026 Claudio Santonastaso. Licensed under Apache-2.0.
